# Configuration file for <https://github.com/sapcc/go-makefile-maker>

metadata:
  url: https://github.com/SAP-cloud-infrastructure/maia

binaries:
  - name:        maia
    fromPackage: .
    installTo:   bin/

golang:
  setGoModVersion: true
  autoupdateDependencies:
    enabled: true
    matchModule: ^github.com/(?:sapcc|sap-cloud-infrastructure)/

dockerfile:
  enabled: yes
  # The React UI (web/ui/) is built during `make generate` via pnpm/build_ui.sh,
  # which `make install` depends on. The builder image therefore needs a JS
  # toolchain so `//go:embed static` finds the compiled assets at compile time.
  # bash is required because build_ui.sh and the vendored Prometheus module
  # build scripts use bash-isms (Alpine ships busybox ash by default).
  extraBuildPackages:
    - nodejs
    - npm
    - pnpm
    - bash

golangciLint:
  createConfig: true

githubWorkflow:
  ci:
    enabled: true
    prepareMakeTarget: generate

nix:
  extraPackages:
    - mockgen
    - nodejs
    - pnpm

typos:
  enabled: true
  extendExcludes:
    - "web/static/vendor/"
    - "web/ui/node_modules/"
    - "web/ui/module/"
    - "web/ui/mantine-ui/src/pages/targets/"
    - "web/ui/mantine-ui/src/pages/service-discovery/"
    - "docs/*.svg"
  extendWords:
    ba: ba
    Alue: Alue
    valu: valu
    tabl: tabl
    pn: pn
    ignor: ignor

renovate:
  enabled: true
  assignees:
    - notque

reuse:
  annotations:
    - paths:
      - mise.toml
      - web/ui/.gitignore
      - web/ui/.nvmrc
      - web/ui/embed.go.tmpl
      SPDX-FileCopyrightText: SAP SE or an SAP affiliate company
      SPDX-License-Identifier: Apache-2.0
    # Upstream Prometheus mantine-ui — forked from
    # https://github.com/prometheus/prometheus at v3.11.2. Copyright is held by
    # The Prometheus Authors (not asserted by SAP), Apache-2.0.
    - paths:
      - web/ui/README.md
      - web/ui/build_ui.sh
      - web/ui/package.json
      - web/ui/pnpm-lock.yaml
      - web/ui/pnpm-workspace.yaml
      - web/ui/mantine-ui/**
      - web/ui/module/**
      SPDX-FileCopyrightText: The Prometheus Authors
      SPDX-License-Identifier: Apache-2.0
    # The Accordion component subtree is dual-licensed: those files carry BOTH an
    # MIT notice (parts derived from Mantine UI, (c) 2021 Vitaly Rtishchev) AND
    # an Apache-2.0 notice for the fork's modifications. A narrower block with
    # precedence "override" declares the accurate compound expression instead of
    # the blanket Apache-2.0 from the mantine-ui block above.
    - paths:
      - web/ui/mantine-ui/src/components/Accordion/**
      precedence: override
      SPDX-FileCopyrightText: The Prometheus Authors
      SPDX-License-Identifier: MIT AND Apache-2.0
    # Maia-specific UI files authored by SAP — override the upstream annotation.
    - paths:
      - web/ui/mantine-ui/src/lib/maiaFetch.ts
      - web/ui/mantine-ui/src/context/MaiaProjectContext.tsx
      - web/ui/mantine-ui/src/components/MaiaProjectSwitcher.tsx
      precedence: override
      SPDX-FileCopyrightText: SAP SE or an SAP affiliate company
      SPDX-License-Identifier: Apache-2.0
    - paths:
      - CLAUDE.md
      - build/*.txt
      - build/*.out
      - etc/*.conf
      - etc/*.json
      - pkg/*/fixtures/*.json
      - pkg/*/fixtures/*.txt
      - pkg/test/*.json
      - docs/*.png
      - docs/*.svg
      - web/static/vendor/bootstrap-3.4.1/css/*.css
      - web/static/vendor/bootstrap-3.4.1/css/*.map
      - web/static/vendor/bootstrap-3.4.1/fonts/*.eot
      - web/static/vendor/bootstrap-3.4.1/fonts/*.svg
      - web/static/vendor/bootstrap-3.4.1/fonts/*.ttf
      - web/static/vendor/bootstrap-3.4.1/fonts/*.woff
      - web/static/vendor/bootstrap-3.4.1/fonts/*.woff2
      - web/static/vendor/bootstrap-3.4.1/js/*.js
      - web/static/vendor/eonasdan-bootstrap-datetimepicker/bootstrap-datetimepicker.min.js
      - web/static/vendor/eonasdan-bootstrap-datetimepicker/bootstrap-datetimepicker.min.css
      - web/static/vendor/**/*.js
      - web/static/js/graph_template.handlebar
      - web/static/vendor/rickshaw/*.css
      - web/static/img/*.gif
      - web/static/img/*.ico
      SPDX-FileCopyrightText: SAP SE or an SAP affiliate company
      SPDX-License-Identifier: Apache-2.0
verbatim: |
  build/maia: generate
  static-check: generate

  build/maia: GO_BUILDFLAGS += -tags builtinassets

  generate: FORCE
    if ! hash mockgen 2>/dev/null; then go install go.uber.org/mock/mockgen@v0.6.0; fi
    if ! hash addlicense 2>/dev/null; then go install github.com/google/addlicense@v1.2.0; fi

    mockgen --source=pkg/storage/interface.go --destination=pkg/storage/genmock.go --package=storage
    mockgen --source=pkg/keystone/interface.go --destination=pkg/keystone/genmock.go --package=keystone

    cd web/ui && bash build_ui.sh
    addlicense -c "SAP SE or an SAP affiliate company" ./web/ui/assets_embed.go ./web/ui/ui.go

